merge_queue:
  max_parallel_checks: 5
  skip_intermediate_results: true
queue_rules:
  - name: default
    batch_size: 1
    allow_inplace_checks: false
    merge_conditions:
      - "check-success=ci"
      - "label=go-merge"
pull_request_rules:
  - name: queue-on-ready
    conditions:
      - "label=ready"
    actions:
      queue:
        name: default
